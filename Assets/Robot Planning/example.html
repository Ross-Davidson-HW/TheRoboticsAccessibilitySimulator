<!doctype html>

<html>
<head>
    <meta charset="utf-8">
    <title>Test</title>
</head>

<body>
    <canvas width ="512" height="512"></canvas>
    <script type = "module">
        console.log("Starting WebGPU code (" + Date().toLocaleString() + ")");
        async function main(){
            console.log("Checking for support, hardware and adapter.");
            if (!navigator.gpu) {
                throw new Error("WebGPU not supported by your browser.");
            }

            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter){
                throw new Error("WebGPU Supported but not appropriate hardware.");
            }

            const device = await adapter.requestDevice();
            if (!device) {
                throw new Error("Error supporting WebGPU in your browser");
            }

            console.log("Getting the WebGPU context from the canvas element and configuring it");
            const canvas = document.querySelector("canvas");
            const context = canvas.getContext("webgpu");
            const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
            context.configure({
                device, 
                format: canvasFormat,});

            const module = device.createShaderModule({
                label: 'Simple Shader',
                code: `
                    @vertex fn vs(
                    @builtin (vertex_index) vertexIndex : u32)
                    -> @builtin(position) vec4f {
                        let pos = array (
                            vec2f (-0.5, 0.5),
                            vec2f (-0.5, -0.5),
                            vec2f (0.5, -0.5),
                            
                            vec2f (0.5, -0.5),
                            vec2f (0.5, 0.5),
                            vec2f (-0.5, 0.5)
                        );
                        return vec4f(pos[vertexIndex], 0.0, 1.0);
                    }
                    @fragment fn fs() -> @location(0) vec4f {
                        return vec4f(0.0, 0.0, 0.7, 1.0);
                    }`
                                
            });
            const pipeline = device.createRenderPipeline({
                label: 'Hardcoded pipeline',
                layout: 'auto',
                vertex: {
                    module,
                },
                fragment: {
                    module,
                    targets: [{format: canvasFormat}],
                },
            });
            const renderPassDescriptor = {
                label: 'Basic canvas render pass',
                colorAttachments: [
                    {
                        clearValue: [1.0, 0.75, 0.60, 1.0],
                        loadOp: 'clear',
                        storeOp: 'store',
                    },
                ],
            };  

            function render(){
                renderPassDescriptor.colorAttachments[0].view = context.getCurrentTexture().createView();
                const encoder = device.createCommandEncoder({ label: 'encoder'});
                const pass = encoder.beginRenderPass(renderPassDescriptor);
                pass.setPipeline(pipeline);
                pass.draw(6);
                pass.end();

                const commandBuffer = encoder.finish();
                device.queue.submit([commandBuffer]);
            }

            render();
        }
        main();
        
    </script>
</body>


</html>
